<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parse-Spec · 英文长难句解析</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/settings.css">
<link rel="stylesheet" href="/static/pdf_reader.css">
</head>
<body>
<header class="topbar">
  <div class="brand-group">
    <span class="brand">Parse-Spec</span>
    <span class="sub">本地离线 · 阅读与拆解英文技术文档</span>
  </div>
  <span class="doc-meta" id="doc-meta">尚未打开 PDF</span>
  <div class="settings-wrap">
    <button class="icon-btn settings-toggle" id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-popover">设置</button>
    <section class="settings-popover" id="settings-popover" aria-label="阅读与解析设置" hidden>
      <div class="settings-heading">
        <div>
        <div class="eyebrow">阅读设置</div>
          <h2>设置</h2>
        </div>
        <button class="icon-btn settings-close" id="settings-close" type="button" aria-label="关闭设置">×</button>
      </div>
      <label class="setting-row" for="theme-select">
        <span><strong>颜色主题</strong><small>调整页面背景与分析栏配色</small></span>
        <select id="theme-select">
          <option value="light">浅色</option>
          <option value="dark">暗色</option>
          <option value="eye">护眼色</option>
        </select>
      </label>
      <label class="setting-row" for="depth-select">
        <span><strong>解析程度</strong><small>控制分析结果展示的信息密度</small></span>
        <select id="depth-select">
          <option value="concise">简洁</option>
          <option value="standard">标准</option>
          <option value="detailed">详细</option>
        </select>
      </label>
      <label class="setting-row" for="position-select">
        <span><strong>分析栏位置</strong><small>内容会按可用空间自动重排</small></span>
        <select id="position-select">
          <option value="right">右侧</option>
          <option value="left">左侧</option>
          <option value="top">上侧</option>
          <option value="bottom">下侧</option>
          <option value="off">关闭</option>
        </select>
      </label>
      <button class="settings-reset" id="settings-reset" type="button">恢复默认设置</button>
    </section>
  </div>
  <button class="icon-btn outline-toggle" id="outline-toggle" type="button" aria-expanded="false" aria-controls="outline-panel" aria-label="打开 PDF 目录">目录</button>
  <button class="icon-btn panel-toggle" id="panel-toggle" type="button" aria-expanded="true" aria-controls="analysis-panel">收起分析</button>
  <label class="btn filebtn">选择 PDF
    <input type="file" id="file" accept="application/pdf" hidden>
  </label>
</header>

<main class="workspace" id="workspace" data-panel-position="right">
  <section id="doc" class="document-pane" aria-label="PDF 阅读区">
    <div class="placeholder" id="placeholder">
      <span class="placeholder-mark">PS</span>
      <h1>打开一篇英文 SPEC</h1>
      <p>悬停可预览句子范围，单击后在分析面板查看逻辑结构、语法主干和术语解释。</p>
      <label class="btn placeholder-btn">选择 PDF
        <input type="file" id="file-empty" accept="application/pdf" hidden>
      </label>
    </div>
    <div id="pages"></div>
  </section>

  <div id="panel-resizer" class="panel-resizer" role="separator" aria-label="调整分析栏宽度" aria-orientation="vertical" tabindex="0"></div>

  <aside id="analysis-panel" class="analysis-panel" aria-label="句子分析栏">
    <header class="panel-header">
      <div>
        <div class="eyebrow">句子结构</div>
        <h2>句子分析</h2>
      </div>
      <button id="panel-close" class="icon-btn close-btn" type="button" aria-label="收起分析栏">×</button>
    </header>
    <div id="analysis-content" class="analysis-content" aria-live="polite">
      <div class="panel-empty">
        <span class="panel-empty-icon">↗</span>
        <h3>从 PDF 中选择一句话</h3>
        <p>悬停查看句子范围，单击锁定分析。面板位置、主题和解析程度可在“设置”中调整。</p>
      </div>
    </div>
  </aside>
</main>

<aside id="outline-panel" class="outline-panel" aria-label="PDF 目录" hidden>
  <header class="outline-header">
    <div><div class="eyebrow">文档导航</div><h2>目录</h2></div>
    <button class="icon-btn outline-close" id="outline-close" type="button" aria-label="关闭目录">×</button>
  </header>
  <div class="outline-content" id="outline-content"><div class="outline-empty">打开 PDF 后读取目录…</div></div>
</aside>

<script type="module" src="/static/app.js"></script>
</body>
</html>
