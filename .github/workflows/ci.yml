name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python 测试（unittest）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖与本地 spaCy 模型 wheel
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ./vendor/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: 运行 Python 测试
        run: python -m unittest discover -s tests -p "test_*.py" -v

  node:
    name: 前端回归（npm test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm ci
        run: npm ci
      - name: npm test（先校验 PDF.js 哈希一致性）
        run: npm test
